<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DealerCraft: Spooky Season by Buggy Games YT</title>
<meta name="description" content="DealerCraft: a blocky 3D farming game. Grow crops, craft goods and sell them to villagers. By Buggy Games YT.">
<meta name="theme-color" content="#150a1e">
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.px{font-family:ui-monospace,"Courier New",monospace;font-weight:700;letter-spacing:.5px}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
#cross:before,#cross:after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px #000}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{top:10px;left:0;height:2px;width:22px}
#stats{position:fixed;left:12px;top:10px;padding:8px 12px;background:rgba(0,0,0,.45);border-radius:10px;font-size:15px;line-height:1.45;text-shadow:0 1px 2px #000}
#stats b{color:#ffb347}
#topbtns{position:fixed;right:10px;top:10px;display:flex;gap:8px;pointer-events:auto}
.tbtn{background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}
#hotbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.5);border-radius:10px;pointer-events:auto}
.slot{width:46px;height:46px;border:2px solid rgba(255,255,255,.25);border-radius:7px;position:relative;display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(255,255,255,.06);cursor:pointer}
.slot.sel{border-color:#ffd84a;background:rgba(255,216,74,.18)}
.slot img{width:30px;height:30px;image-rendering:pixelated}
.slot .n{position:absolute;right:3px;bottom:0;font-size:12px;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
.slot .t{position:absolute;left:2px;top:0;font-size:9px;font-weight:700;color:#bff;text-shadow:0 0 3px #000}
#target{position:fixed;left:50%;top:calc(50% + 22px);transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px;display:none;white-space:nowrap}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.show{opacity:1}
.panel{position:fixed;inset:0;background:rgba(5,3,14,.72);display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:5}
.panel.show{display:flex}
.box{background:#1a0f24;border:3px solid #ff7a1a;border-radius:14px;width:min(720px,94vw);max-height:90vh;overflow:auto;padding:14px 16px;box-shadow:0 10px 40px #000;touch-action:pan-y}
.box *{touch-action:pan-y}
.box h2{margin:0 0 4px;font-size:22px}
.box h3{margin:12px 0 6px;font-size:15px;color:#ffb347;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.05);margin:4px 0;font-size:15px}
.row .ic{width:32px;text-align:center;font-size:22px}.row .ic img{width:26px;height:26px;image-rendering:pixelated;vertical-align:middle}
.row .nm{flex:1}.row .pr{color:#ffd84a;min-width:64px;text-align:right}
.btn{background:#6b2fa0;border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;font-weight:700}
.btn:disabled{background:#3a3450;color:#888;cursor:default}
.btn.gold{background:#c99a12}
.close{float:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.up{color:#6f6}.down{color:#f77}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,rgba(255,110,20,.28),rgba(40,10,60,.6) 45%,rgba(0,0,0,.9));z-index:10;text-align:center;padding:20px;cursor:pointer}
#start h1{font-size:min(72px,13vw);margin:0;line-height:1;color:#ff8a1a;text-shadow:-4px 0 #7a2bd6,4px 0 #39ff7a,0 6px 0 #000,0 0 30px rgba(255,120,20,.8);animation:flick 3s infinite}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.55}50%{opacity:1}52%{opacity:.7}53%{opacity:1}}
#start .ed{font-size:18px;color:#39ff7a;letter-spacing:3px;margin-top:6px;text-shadow:0 0 10px #39ff7a}
#start .sub{margin:10px 0 18px;font-size:17px;color:#d8ccff}
#start .play{font-size:24px;padding:12px 34px;border-radius:12px;background:#e8650f;border:3px solid #a33f00;box-shadow:0 5px 0 #5a2200,0 0 24px rgba(255,120,20,.6);font-weight:700}
#start .help{margin-top:18px;font-size:14px;color:#bbb;line-height:1.6;max-width:560px}
#start .by{position:absolute;bottom:12px;font-size:13px;color:#999}
#touch{display:none;pointer-events:none}
body.touch #touch{display:block}
#joy{position:fixed;left:24px;bottom:80px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25)}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.4)}
.tb{position:fixed;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:26px;pointer-events:auto}
.tb.on{background:rgba(255,216,74,.35)}
#bJump{right:24px;bottom:84px}#bUse{right:100px;bottom:120px}#bBreak{right:40px;bottom:166px}
body.touch #hotbar .slot{width:42px;height:42px}
body.touch #cross{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="cross"></div>
  <div id="stats"></div>
  <div id="target"></div>
  <div id="toast"></div>
  <div id="topbtns"><button class="tbtn" id="bMute">🔊</button><button class="tbtn" id="bBag">🎒 Bag</button><button class="tbtn" id="bHelp">❔</button></div>
  <div id="hotbar"></div>
  <div id="touch">
    <div id="joy"><div id="knob"></div></div>
    <div class="tb" id="bBreak">⛏️</div>
    <div class="tb" id="bUse">✋</div>
    <div class="tb" id="bJump">⬆️</div>
  </div>
</div>
<div class="panel" id="bag"><div class="box" id="bagBox"></div></div>
<div class="panel" id="trade"><div class="box" id="tradeBox"></div></div>
<div id="start">
  <h1 class="px">DEALER<br>CRAFT</h1>
  <div class="ed px">🎃 SPOOKY SEASON 🎃</div>
  <div class="sub">Grow pumpkins. Catch ghosts. Brew potions. Explore an endless haunted world.</div>
  <div class="play">🎃 PLAY</div>
  <div class="help" id="helpText"></div>
  <div class="by">by Buggy Games YT</div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
