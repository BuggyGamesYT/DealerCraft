name: Export desktop files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download release files and push to export branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cd out
          gh release download v1.16 -R ${{ github.repository }} -p '*.apk'
          for f in *; do split -b 45m -d "$f" "$f.part"; rm "$f"; done
          ls -la
          git init -q -b itch-export && git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm export
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" itch-export
